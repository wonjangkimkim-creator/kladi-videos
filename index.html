<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>클라디수학 반포 해설영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa;--panel:#ffffff;--ink:#14213a;--sub:#5d6b82;--line:#e2e7ef;
  --brand:#1f3a5f;--accent:#f2a33a;--chip:#eef2f8;--chipOn:#1f3a5f;--chipOnInk:#fff;
  --hi:#d9480f;--mid:#1971c2;--pend:#9aa5b5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522;--panel:#162033;--ink:#e8edf5;--sub:#9aa8be;--line:#25324a;
    --brand:#2c4f80;--chip:#1d2a40;--chipOn:#f2a33a;--chipOnInk:#14213a;--pend:#5f6c80;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:#fff}
header .wrap{display:flex;align-items:center;gap:12px;padding:18px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#14213a;display:grid;place-items:center;font-weight:900;font-size:20px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
header p{margin:2px 0 0;font-size:12.5px;opacity:.75}
header .out{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 26px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(20,33,58,.08)}
.lockbox .logo{margin:0 auto 14px;width:52px;height:52px;font-size:26px;border-radius:14px}
.lockbox h2{margin:0 0 4px;font-size:19px}
.lockbox p{margin:0 0 20px;color:var(--sub);font-size:13.5px}
.lockbox input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);text-align:center;letter-spacing:2px}
.lockbox input:focus{outline:none;border-color:var(--accent)}
.lockbox button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.lockbox label{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;font-size:13px;color:var(--sub)}
.err{color:var(--hi);font-size:13px;min-height:18px;margin-top:10px}

/* app */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--chipOn);color:var(--chipOnInk);font-weight:700}
.count{font-size:12.5px;color:var(--sub);margin:14px 0 4px}
.group h3{font-size:15px;margin:22px 0 10px;display:flex;gap:8px;align-items:baseline}
.group h3 small{font-weight:400;color:var(--sub);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:transform .12s,border-color .12s;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{transform:translateY(-1px);border-color:var(--accent)}
.card.pending{cursor:default;opacity:.62}
.card.pending:hover{transform:none;border-color:var(--line)}
.play{flex:none;width:42px;height:42px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.pending .play{background:var(--pend)}
.play svg{width:16px;height:16px;fill:#fff;margin-left:2px}
.meta{min-width:0;flex:1}
.num{font-weight:700;font-size:15px}
.topic{font-size:13.5px;color:var(--sub);margin-top:2px;line-height:1.4}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--sub)}
.tag.hi{background:rgba(217,72,15,.12);color:var(--hi);font-weight:700}
.tag.mid{background:rgba(25,113,194,.12);color:var(--mid);font-weight:700}
.tag.ans{background:rgba(242,163,58,.16);color:#b86e00}
.empty{padding:50px 0;text-align:center;color:var(--sub)}
footer{padding:30px 0 40px;text-align:center;color:var(--sub);font-size:12px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,10,20,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.open{display:flex}
.mbox{width:100%;max-width:960px}
.mhead{display:flex;align-items:center;color:#fff;margin-bottom:10px;gap:10px}
.mhead b{font-size:15px}
.mhead a{margin-left:auto;color:#fff;opacity:.8;font-size:13px}
.mhead button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="logo">K</div>
    <h2>클라디수학 반포</h2>
    <p>선생님 전용 해설영상 라이브러리</p>
    <input type="password" id="pw" placeholder="비밀번호" autofocus>
    <button type="submit" id="go">들어가기</button>
    <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <div class="err" id="err"></div>
  </form>
</section>

<div id="app" hidden>
  <header><div class="wrap">
    <div class="logo">K</div>
    <div><h1>클라디수학 반포 해설영상</h1><p>선생님 전용 · 외부 공유 금지</p></div>
    <button class="out" id="logout">잠그기</button>
  </div></header>
  <div class="wrap">
    <div class="tools">
      <input class="search" id="q" placeholder="학교, 번호, 주제로 검색 (예: 로그, 경원중 22)">
      <div class="chips" id="schoolChips"></div>
      <div class="chips" id="subjectChips"></div>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
  <footer>클라디수학학원 반포 · 업데이트 <span id="updated"></span></footer>
</div>

<div id="modal">
  <div class="mbox">
    <div class="mhead"><b id="mtitle"></b><a id="mlink" target="_blank" rel="noopener">유튜브에서 열기 ↗</a><button id="mclose" aria-label="닫기">×</button></div>
    <div class="vid"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  </div>
</div>

const KEY='kladi_lib_pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

let DATA=null, fSchool='전체', fSubject='전체';
async function tryOpen(pw,remember){
  try{
    const d=await unlock(pw);
    DATA=d; if(remember) store(KEY,pw); else store(KEY,null);
    document.getElementById('lock').hidden=true;
    document.getElementById('app').hidden=false;
    init(); return true;
  }catch(e){ return false; }
}
document.getElementById('lockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='확인 중…';
  const ok=await tryOpen(document.getElementById('pw').value,document.getElementById('remember').checked);
  btn.disabled=false; btn.textContent='들어가기';
  if(!ok){document.getElementById('err').textContent='비밀번호가 맞지 않습니다.';document.getElementById('pw').select();}
});
document.getElementById('logout').onclick=()=>{store(KEY,null);location.reload();};
(async()=>{const s=load(KEY); if(s && !(await tryOpen(s,true))) store(KEY,null);})();

function chipRow(el,items,cur,set){
  el.innerHTML='';
  ['전체',...items].forEach(v=>{
    const b=document.createElement('button');b.className='chip'+(v===cur?' on':'');b.textContent=v;
    b.onclick=()=>{set(v);render();};el.appendChild(b);
  });
}
function uniq(a){return [...new Set(a.filter(Boolean))]}
function ytId(u){const m=(u||'').match(/youtu\.be\/([\w-]{6,})/)||(u||'').match(/[?&]v=([\w-]{6,})/);return m?m[1]:null}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function init(){
  document.getElementById('updated').textContent=DATA.updated;
  document.getElementById('q').oninput=render;
  render();
}
function render(){
  const V=DATA.videos;
  chipRow(document.getElementById('schoolChips'),uniq(V.map(v=>v.school)),fSchool,v=>fSchool=v);
  chipRow(document.getElementById('subjectChips'),uniq(V.map(v=>v.subject)),fSubject,v=>fSubject=v);
  const q=document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list=V.filter(v=>(fSchool==='전체'||v.school===fSchool)&&(fSubject==='전체'||v.subject===fSubject)
    &&q.every(t=>[v.exam,v.school,v.grade,v.subject,v.number,v.topic].join(' ').toLowerCase().includes(t)));
  const ready=list.filter(v=>v.link).length;
  document.getElementById('count').textContent=`${list.length}편 · 바로 보기 ${ready}편`;
  const groups={};
  list.forEach(v=>{const k=`${v.exam}|${v.school} ${v.grade}`;(groups[k]=groups[k]||[]).push(v)});
  const box=document.getElementById('list');
  if(!list.length){box.innerHTML='<div class="empty">조건에 맞는 영상이 없습니다.</div>';return;}
  box.innerHTML=Object.entries(groups).map(([k,vs])=>{
    const [exam,sch]=k.split('|');
    return `<div class="group"><h3>${esc(sch)} <small>${esc(exam)} · ${vs.length}편</small></h3><div class="grid">`+
    vs.map((v,i)=>{
      const lv=v.level==='최상'?'<span class="tag hi">최상</span>':v.level==='상'?'<span class="tag mid">상</span>':'';
      return `<button class="card${v.link?'':' pending'}" data-i="${V.indexOf(v)}">
        <span class="play"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>
        <span class="meta"><div class="num">${esc(v.subject)} ${esc(v.number)}</div>
        <div class="topic">${esc(v.topic||'')}</div>
        <div class="tags">${lv}${v.answer?`<span class="tag ans">정답 ${esc(v.answer)}</span>`:''}${v.duration?`<span class="tag">${esc(v.duration)}</span>`:''}${v.link?'':'<span class="tag">업로드 예정</span>'}</div></span>
      </button>`}).join('')+`</div></div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(c=>c.onclick=()=>openV(V[+c.dataset.i]));
}
function openV(v){
  const id=ytId(v.link); if(!id) return;
  document.getElementById('mtitle').textContent=`${v.school} ${v.grade} ${v.subject} ${v.number}`;
  document.getElementById('mlink').href=v.link;
  document.getElementById('frame').src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
  document.getElementById('modal').classList.add('open');
}
function closeV(){document.getElementById('modal').classList.remove('open');document.getElementById('frame').src='about:blank';}
document.getElementById('mclose').onclick=closeV;
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeV();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV();});
</script>
</body>
